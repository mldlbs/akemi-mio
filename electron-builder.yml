appId: com.akemi-mio.wallpaper
productName: AkemiMio
directories:
  output: dist-electron
  buildResources: build
afterPack: build/afterPack.js
files:
  - "out/**/*"
  - "package.json"
  - "CONSTITUTION.md"
  - "!models/**"
  - "!out/**/*.map"
  - "!out/**/*.txt"
  - "!out/electron.vite.config.*"
  - "!out/tsconfig*.tsbuildinfo"
  - "!out/src/**"
  - "!docs/**"
  - "!.claude*/**"
  - "!.githooks/**"
  - "!.swarm/**"
  - "!.openclaude/**"
  - "!.prettierrc"
  - "!.aiguard.yml"
  - "!src/**"
  - "!mcp_workspace/**"
  - "!evolution_workspace/**"
  - "!vitest.config.*"
  - "!eslint.config.*"
  - "!tsconfig*.json"
  - "!**/tsconfig*.json"
  - "!logs.txt"
  - "!logs/**"
  - "!**/node_modules/**/*.map"
# MCP 服务器是 spawn 出来的**独立 node 进程**，裸 node 读不了 asar 里的文件
# （表现为 Cannot find module ...app.asar\node_modules\@playwright\mcp\cli.js）。
# 所以这几个包必须解包到 app.asar.unpacked，运行时再把路径指过去。
asarUnpack:
  - "node_modules/@playwright/mcp/**/*"
  - "node_modules/playwright/**/*"
  - "node_modules/playwright-core/**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AkemiMio
  uninstallDisplayName: "AkemiMio 秋山澪 AI 语音助手"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
extraResources:
  - from: "."
    filter:
      - "icon.png"
npmRebuild: false
electronDist: node_modules/electron/dist
publish:
  - provider: generic
    url: "https://skills.crlkcloud.cyou/update"
    channel: latest
