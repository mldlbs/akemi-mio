name: CI

# Every job installs npm 11 before `npm ci`: npm 10 cannot build the ideal tree
# for this dependency graph -- it dies with "Cannot read properties of null
# (reading 'edgesOut')". That is reproducible with vitest@4.1 as the sole
# dependency, so it is NOT caused by the workspace protocol; npm 11 fixes it
# without loosening peer-dependency semantics (no --legacy-peer-deps needed).
# `npm ci` happens to pass on npm 10 because it never re-resolves the tree, but
# `npm install` and any future lock regeneration still require npm 11.
#
# Node 22, not 20: the mio-cli test script passes GLOB patterns to `node --test`
# (`node --test "__tests__/*.test.js" ...`), and glob support in the test runner
# only landed in Node 21. On Node 20 the pattern is treated as a literal path,
# the file is not found, and the job exits 1 -- while passing on any dev machine
# running Node 22. Node 22 is also what this repo is developed against.

on:
  push:
    branches: [master, main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci

      # typecheck:budget rather than typecheck: it runs BOTH tsconfigs and reports a
      # combined count with an explicit ceiling. `npm run typecheck` is
      # `tsc -p node && tsc -p web`, so when node has errors the web side is never
      # even run -- that is exactly how the renderer silently carried hundreds of
      # errors before 2026-09-11 (it is transpiled by esbuild, which erases types
      # without checking them). Same cost when clean; strictly more visible when not.
      - name: Type check (budget = 0)
        run: npm run typecheck:budget

      # --max-warnings is required: every rule in eslint.config.mjs is set to
      # "warn", so without a threshold the exit code is always 0 and this step
      # cannot fail no matter how many problems it prints. 130 is the current
      # measured count; injecting a single new violation must fail the build.
      # NOTE: this number must only ever be lowered deliberately. Fixing a
      # warning lowers the count and silently loosens the threshold, so when you
      # clean any up, drop this number to match in the same commit.
      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 130

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,json,css}"

      - name: mio-agent-runtime syntax gate
        run: npm run check --workspace mio-agent-runtime

      # 形态（pet / chat / wallpaper）的窗口参数在三个文件里各留一份副本：
      # src/renderer/src/forms/types.ts、packages/core/src/core/Lifecycle.ts、
      # electron.vite.config.ts 的 renderer input。三份副本各自内部自洽，
      # 所以构建、typecheck、lint 都不会因为漏改一处而报错 —— 症状是运行期窗口空白。
      # scripts/check-renderer-entries.cjs 能在运行期抓到，但它要启动打包好的 exe，
      # 进不了这个 job（此处还没有产物）。这道静态门禁是它的等价物，秒级无依赖。
      - name: Form registry consistency (types.ts / Lifecycle.ts / vite input)
        run: npm run check:form-registry

      - name: Build
        run: npx electron-vite build

  main-tests:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - name: Main process tests + coverage
        run: npx vitest run --coverage

  renderer-tests:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - name: Renderer tests + coverage
        run: npx vitest run --config vitest.config.renderer.ts --coverage

  preload-tests:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - name: Preload tests
        run: npx vitest run --config vitest.config.preload.ts --coverage

  mio-cli-tests:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci

      # 7 个 workspace 包的 `main` 指向 `./dist/index.js`，而 `dist` 被 gitignore
      # （`.gitignore:2`）—— 全新检出里它们不存在。
      #
      # electron-vite 把 `@akemi-mio/*` alias 到 `packages/*/src` 直接打进 bundle，
      # 所以**应用**不需要 dist；但 mio-cli 是 plain CommonJS，走的是
      # `require('@akemi-mio/insight')` → package.json 的 main → dist，没有 bundler
      # 兜底。缺 dist 时 insight-store.js / observer-store.js 的两步解析**两条都指向
      # 同一个缺失文件**（回退 `require('../../insight')` 命中同一个 main），于是
      # isInsightAvailable() 返回 false，13 个 mio.insight.* / mio.observer.* 工具从
      # tools/list 整体消失。
      #
      # 09-22 实测：这一步缺席时 `check:mcp-live` 在 CI 上红（`mio-cli-tests` 的失败
      # 点从「mio-agent-runtime tests」前移到了它），而该门禁自己会把原因打出来：
      #   dispatchable but NOT offered by tools/list (13): mio.insight.generate, ...
      #   an isXxxAvailable() gate is swallowing them -- check that the optional package resolves
      # 本机复现：移走 packages/insight/dist 与 packages/observer/dist → exit 1；
      # 放回 → exit 0。所以这是「全新检出没构建」，不是门禁定错了期望值。
      #
      # `--if-present` 恰好只命中这 7 个包（有 build 脚本的包与 main 指向 dist 的包
      # 是同一批 7 个），以后加包自动跟随。本机实测 26.4s。
      - name: Build the workspace packages mio-cli requires through main (dist is gitignored)
        run: npm run build --workspaces --if-present

      # The mio-agent-runtime CLI is plain CommonJS and uses node:test, so it is
      # not covered by any of the vitest configs above -- without this job none
      # of its tests run in CI at all.
      #
      # These four steps go through run-with-annotations.mjs because none of them
      # is vitest: vitest emits `::error::` lines by itself, so its failures come
      # back as readable check-run annotations, but `node --test` and the plain
      # node check scripts do not. Until 2026-09-22 the entire job's annotation
      # for a failure was "Process completed with exit code 1." -- the real error
      # was only in the job log, which needs admin rights to read even on a
      # public repo. The wrapper is transparent (same exit code) and only adds
      # annotations on failure.
      - name: mio-agent-runtime tests
        run: node scripts/run-with-annotations.mjs npm test --workspace mio-agent-runtime

      - name: README commands match the CLI
        run: node scripts/run-with-annotations.mjs npm run check:cli-docs

      # Every MCP tool must stay reachable from the terminal and documented;
      # mio.insight.generate drifted out of both for weeks before anyone noticed.
      - name: MCP tools are reachable from the CLI
        run: node scripts/run-with-annotations.mjs npm run check:coverage

      # Reachable on paper is not the same as offered at runtime: a failing
      # isXxxAvailable() hides a tool from tools/list while its dispatch case
      # survives, which is invisible to every other gate.
      - name: MCP tools are actually offered at runtime
        run: node scripts/run-with-annotations.mjs npm run check:mcp-live

  # The two gates in this job need a real packaged exe, which no other job
  # produces -- until 2026-09-21 they simply never ran anywhere. They are the
  # only gates that can see packaged-only failures (asarUnpack paths, a window
  # that paints in dev but is blank in the exe) and the only ones that measure
  # what the app actually costs at idle.
  packaging:
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci

      - name: Build renderer + main bundles
        run: npm run build

      # electron 42 的 npm 包**没有 postinstall**（实测 42.4.0 与 42.9.3 的
      # package.json 里都没有 scripts 字段；锁文件里也没有 hasInstallScript），
      # 二进制改由 `install-electron` 这个显式 bin 下载。于是全新 `npm ci` 之后
      # node_modules/electron/dist 并不存在 —— 而 electron-builder.yml 里
      # `electronDist: node_modules/electron/dist` 正指着它。
      #
      # 症状很有迷惑性：`electron-builder --win --dir` 在 **3 秒内**退出 1
      # （本机同一命令要 8 分钟）。3 秒意味着它连 Electron 都还没开始拷，就死在
      # 「using custom unpacked Electron distribution」那一步。本机之所以一直
      # 看不出来，是因为 dist 早就在 node_modules 里躺着了（Aug 24 建好，从未
      # 被清掉）—— 又一个「本机绿 ≠ CI 绿」。
      #
      # install.js 是幂等的：dist 已在时它空转退出 0。
      - name: Fetch Electron binary (npm ci does not)
        run: node node_modules/electron/install.js

      # --dir instead of the configured nsis target: both scripts below look for
      # dist-electron/win-unpacked/AkemiMio.exe, which is exactly what --dir
      # produces. It also skips the NSIS step and the winCodeSign download,
      # which is minutes we do not need to spend to answer the question.
      - name: Package (unpacked directory)
        run: npx electron-builder --win --dir

      # Boots the real exe and opens every renderer entry (pet / chat /
      # wallpaper / agent), then checks it actually painted by measuring the
      # layout height chain. A blank window passes build, typecheck, lint and
      # every vitest config -- only this sees it.
      - name: Every renderer entry actually paints (packaged exe)
        run: npm run check:renderer-entries

      # THRESHOLDS ARE UNCALIBRATED ON CI. --gpu-budget / --delta-budget default
      # to 20 / 15, derived on a dev machine with a real GPU; GitHub runners are
      # software-rasterised, so the absolute number is not comparable yet. The
      # A/B delta (animations on vs. animations off, same machine, same run) is
      # the load-bearing assertion and does travel across machines. If the
      # absolute budget goes red on the first runs, recalibrate it from the
      # measured numbers -- do NOT silence the step.
      - name: Idle GPU budget (packaged exe)
        run: npm run check:idle-gpu -- --warmup=30 --samples=2 --interval=6

      - name: Upload unpacked build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: dist-electron/win-unpacked
