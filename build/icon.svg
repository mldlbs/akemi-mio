<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0F2E"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Subtle glow overlay -->
  <rect x="0" y="0" width="1024" height="512" rx="225" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="512" cy="440" r="200" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.4"/>

  <!-- Sound wave arcs -->
  <path d="M340 400 Q320 440 340 480" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M310 370 Q280 440 310 510" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M684 400 Q704 440 684 480" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M714 370 Q744 440 714 510" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- Microphone body -->
  <rect x="432" y="310" width="160" height="200" rx="80" fill="url(#mic)"/>

  <!-- Microphone highlight -->
  <rect x="450" y="330" width="60" height="160" rx="30" fill="rgba(255,255,255,0.3)"/>

  <!-- Microphone top bar -->
  <rect x="492" y="280" width="40" height="50" rx="20" fill="url(#mic)"/>

  <!-- Microphone base line -->
  <rect x="482" y="510" width="60" height="12" rx="6" fill="url(#mic)"/>

  <!-- Stand -->
  <rect x="502" y="520" width="20" height="160" rx="10" fill="url(#mic)"/>

  <!-- Stand base -->
  <rect x="440" y="670" width="144" height="16" rx="8" fill="url(#mic)"/>

  <!-- Music note -->
  <g transform="translate(600, 540)" opacity="0.9">
    <ellipse cx="30" cy="60" rx="20" ry="15" fill="#A78BFA" transform="rotate(-20)"/>
    <rect x="46" y="10" width="6" height="55" rx="3" fill="#A78BFA"/>
    <rect x="46" y="10" width="48" height="6" rx="3" fill="#A78BFA"/>
    <rect x="82" y="10" width="6" height="20" rx="3" fill="#A78BFA"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="300" cy="650" r="6" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="720" cy="620" r="4" fill="#8B5CF6" opacity="0.2"/>
  <circle cx="280" cy="350" r="5" fill="#8B5CF6" opacity="0.2"/>
  <circle cx="740" cy="300" r="3" fill="#8B5CF6" opacity="0.15"/>
</svg>
